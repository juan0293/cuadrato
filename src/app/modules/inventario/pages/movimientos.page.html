<ion-content class="inventario-module-page">
  <main class="shell">
    <section class="header">
      <div><h1>Movimientos de inventario</h1><p>Consulta las entradas y salidas registradas.</p></div>
      <ion-button class="btn-primary" routerLink="/admin/inventario/movimientos/nuevo"><ion-icon slot="start" name="add-outline"></ion-icon>Nuevo movimiento</ion-button>
    </section>
    <section class="card inventory-list-card" *ngIf="movimientos$ | async as movimientos">
      <app-movimiento-inventario-card *ngFor="let movimiento of movimientos" [movimiento]="movimiento"></app-movimiento-inventario-card>
      <app-empty-state *ngIf="movimientos.length === 0" title="Sin movimientos" message="No hay movimientos registrados."></app-empty-state>
    </section>
  </main>
</ion-content>
