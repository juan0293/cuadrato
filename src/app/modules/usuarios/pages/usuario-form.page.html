<ion-header class="modal-header">
  <ion-toolbar>
    <ion-title>{{ userId ? 'Editar usuario' : 'Nuevo usuario' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="crud-page">
  <div class="shell ion-padding">
    <section class="card">
      <h2>{{ userId ? 'Actualizar usuario interno' : 'Crear usuario interno' }}</h2>
      <p>Define acceso, rol operativo y estado del usuario.</p>

      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="grid">
          <ion-item>
            <ion-label position="stacked">Nombre</ion-label>
            <ion-input formControlName="nombre"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Email</ion-label>
            <ion-input formControlName="email" type="email"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Rol</ion-label>
            <ion-select formControlName="rol">
              <ion-select-option value="admin">Admin</ion-select-option>
              <ion-select-option value="asistente">Asistente</ion-select-option>
              <ion-select-option value="artista">Artista</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Teléfono</ion-label>
            <ion-input formControlName="telefono"></ion-input>
          </ion-item>
        </div>

        <ion-item lines="none">
          <ion-label>Activo</ion-label>
          <ion-toggle formControlName="activo"></ion-toggle>
        </ion-item>

        <div class="actions">
          <ion-button type="submit" class="btn-primary">Guardar</ion-button>
        </div>
      </form>
    </section>
  </div>
</ion-content>
