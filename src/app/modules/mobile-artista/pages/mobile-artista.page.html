<ion-header>
  <ion-toolbar>
    <ion-title>Panel artista</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2 class="section-title">Próximas citas</h2>
  <div *ngIf="citas$ | async as citas" class="section-block">
    <app-cita-card *ngFor="let cita of citas" [cita]="cita"></app-cita-card>
    <ion-text color="medium" *ngIf="citas.length === 0">No hay citas asignadas.</ion-text>
  </div>

  <h2 class="section-title">Consumo rápido de insumos</h2>
  <form [formGroup]="consumoForm" (ngSubmit)="registrarConsumo()" class="section-block">
    <ion-item>
      <ion-label position="stacked">Insumo</ion-label>
      <ion-select formControlName="insumoId">
        <ion-select-option *ngFor="let insumo of insumos$ | async" [value]="insumo.id">{{ insumo.nombre }}</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Cantidad</ion-label>
      <ion-input formControlName="cantidad" type="number"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Cita (opcional)</ion-label>
      <ion-select formControlName="citaId">
        <ion-select-option *ngFor="let cita of citas$ | async" [value]="cita.id">{{ cita.fecha }} · {{ cita.clienteNombre }}</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top">Registrar consumo</ion-button>
  </form>
</ion-content>
