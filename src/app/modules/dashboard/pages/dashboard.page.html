<ion-header class="ion-no-border dashboard-header">
  <ion-toolbar class="dashboard-toolbar"mode="ios">
    <div class="toolbar-inner">
      <ion-title>Dashboard</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-page">
  <div class="shell ion-padding">
    <section class="command-center card">
      <div class="command-hero">
        <div class="command-logo" *ngIf="logoPath$ | async as logoPath; else logoFallback">
          <img [src]="logoPath" alt="Logo" />
        </div>
        <ng-template #logoFallback>
          <div class="command-logo command-logo--fallback">
            <span>VT</span>
            <small>Vargas TattooApp</small>
          </div>
        </ng-template>

        <h1 class="command-title">Centro de mando</h1>
        <p class="command-subtitle">Gestiona tus operaciones desde un solo lugar.</p>
      </div>
    </section>

    <section class="quick-actions-card card">
      <div class="section-head">
        <h2>Centro de mando</h2>
        <p>Accede rápidamente a los módulos principales de gestión.</p>
      </div>

      <div class="quick-actions-grid" *ngIf="normalizedRole$ | async as currentRole">
        <ng-container *ngFor="let item of quickActions">
          <a
            class="quick-action-item"
            *ngIf="canAccess(item, currentRole); else blockedQuickAction"
            [routerLink]="item.route"
            routerLinkActive="menu-item-active"
          >
            <div class="quick-action-icon">
              <ion-icon [name]="item.icon"></ion-icon>
            </div>
            <h3 class="quick-action-title">{{ item.title }}</h3>
            <p class="quick-action-description">{{ item.description }}</p>
          </a>

          <ng-template #blockedQuickAction>
            <div class="quick-action-item quick-action-item--locked" aria-disabled="true">
              <div class="quick-action-icon">
                <ion-icon [name]="item.icon"></ion-icon>
              </div>
              <h3 class="quick-action-title">{{ item.title }}</h3>
              <p class="quick-action-description">{{ item.description }}</p>
              <span class="quick-action-lock">
                <ion-icon name="lock-closed-outline"></ion-icon>
                Acceso bloqueado
              </span>
            </div>
          </ng-template>
        </ng-container>
      </div>
    </section>

    <!-- <section class="card">
      <ion-list class="menu-list" lines="none">
        <ion-menu-toggle autoHide="true">
          <ion-item *ngFor="let item of quickActions" [routerLink]="item.route" routerLinkActive="menu-item-active">
            <ion-icon slot="start" [name]="item.icon"></ion-icon>
            <ion-label>{{ item.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </section> -->
  </div>
</ion-content>
