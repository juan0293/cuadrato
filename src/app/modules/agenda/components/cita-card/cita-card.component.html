<ion-card>
  <ion-card-header>
    <ion-card-title>{{ cita.clienteNombre }}</ion-card-title>
    <ion-card-subtitle>{{ cita.artistaNombre }} · {{ cita.horaInicio }} - {{ cita.horaFin }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <p>{{ cita.descripcionTrabajo }}</p>
    <ion-chip [color]="estadoColor(cita.estado)">
      <ion-label>{{ estadoLabel(cita.estado) }}</ion-label>
    </ion-chip>
  </ion-card-content>
</ion-card>
