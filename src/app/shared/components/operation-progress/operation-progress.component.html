<ion-modal [isOpen]="open" [backdropDismiss]="false" [canDismiss]="canDismiss"
  style="--width: 100%; --height: 100%; --max-width: 100%; --max-height: 100%; --border-radius: 0;">
  <ng-template>
    <section class="app-boot-overlay" [class.theme-light]="themeService.theme === 'light'"
      [class.theme-dark]="themeService.theme === 'dark'" role="status" aria-live="polite" aria-busy="true">
      <article class="app-boot-card">
        <header class="app-boot-header">
          <div class="app-boot-identity">
            <span class="app-boot-logo-wrap"><img src="assets/icon/cuadrato.png" alt="" class="app-boot-logo" /></span>
            <div><span class="app-boot-eyebrow">CuadraTó · Gestión</span><strong>Control de compras</strong></div>
          </div>
          <span class="app-boot-stage"><ion-spinner name="crescent"></ion-spinner>{{ stage }}</span>
        </header>
        <div class="app-boot-copy">
          <span class="app-boot-icon"><ion-icon name="briefcase" size="large"></ion-icon></span>
          <h1>{{ title }}</h1><p>{{ message }}</p>
        </div>
        <div class="app-boot-progress" aria-hidden="true"><span class="app-boot-bar"></span></div>
        <footer class="app-boot-footer"><ion-icon name="shield-checkmark-outline"></ion-icon><span>Espera un momento mientras completamos el registro.</span></footer>
      </article>
    </section>
  </ng-template>
</ion-modal>
